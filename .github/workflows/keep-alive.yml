name: keep-alive

# Render's free tier spins the web service down after ~15 min of inactivity,
# and a cold boot takes 30-60s — which breaks external validators that fetch
# our URLs with short timeouts (e.g. Meta's "Data deletion instructions URL
# should represent a valid URL" error when the app is asleep). Pinging every
# 5 min keeps the instance warm. Public repo -> Actions minutes are free.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the app instance warm
        run: curl -fsS --max-time 30 -o /dev/null https://arda-piosphere.onrender.com/health || true
