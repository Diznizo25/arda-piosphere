name: refresh-indices

# Two-week satellite refresh: recompute the index stack in Earth Engine and push
# updated COGs + 8x overviews to R2, so advisories always reflect ~2-week-old
# (or fresher) Sentinel-2 data.
#
# Pipeline (scripts/refresh_indices.py --ward <ward>):
#   generate_piosphere_zones -> gee_export_to_asset.py --export-only --force
#     (FREE GEE-Asset path; the service account has no Drive/GCS quota, so the
#      old Drive export always fails with "Service accounts do not have storage
#      quota") -> transfer_assets_to_r2.py --force --fresh -> build_overview_cogs.
# The orchestrator always exits 0 (no GitHub failure emails); per-step problems
# are logged, surfaced in the ops dashboard activity feed, and retried by the
# next scheduled run.
#
# Setup (one time, in the repo Settings -> Secrets and variables -> Actions):
#   DATABASE_URL            Supabase Postgres connection string
#   SUPABASE_URL            project URL (https://<ref>.supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_ENDPOINT_URL
#   GEE_PROJECT_ID, GEE_SERVICE_ACCOUNT_EMAIL
#   GEE_SERVICE_ACCOUNT_KEY  the service-account private-key JSON (as a single-line secret)

on:
  schedule:
    # Every 14 days at 03:00 UTC.
    - cron: "0 3 */14 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Nine water points x ~40 min transfers + GEE export + retries can exceed
    # 6h; give the run headroom so a slow link never aborts mid-transfer.
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Keep in sync with .python-version (3.11). requirements.txt pins
          # rasterio==1.3.11 and osmium==3.7.0, which ship no cp312 wheels —
          # pip would try (and fail) to compile them from source on 3.12.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GEE service-account key
        run: |
          mkdir -p secrets
          echo "$GEE_KEY" > secrets/gee-service-account.json
        env:
          GEE_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}

      - name: Refresh satellite indices (Oldonyiro)
        run: python scripts/refresh_indices.py --ward Oldonyiro
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
          GEE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }}
          GEE_SERVICE_ACCOUNT_KEY_PATH: ./secrets/gee-service-account.json
